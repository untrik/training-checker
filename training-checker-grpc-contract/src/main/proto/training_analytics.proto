syntax = "proto3";

// Java-пакет для сгенерированных классов
option java_package = "edu.rutmiit.grpc";

// Все сгенерированные классы будут в отдельных файлах (не во вложенных классах)
option java_multiple_files = true;

// Пакет proto (для именования в других .proto файлах при импорте)
package workoutanalytics;

// Сервисы
// Unary RPC - один запрос это один ответ (типа аналог REST GET/POST)
service WorkoutAnalytics {

  // Анализирует summary и возвращает вычисленные метрики
  rpc AnalyzeWorkout (AnalyzeWorkoutRequest) returns (WorkoutAnalysisResponse);
}
// Сообщения
// В proto3 все поля опциональны по умолчанию (zero-value = не задано).
// Номера полей (1, 2, 3...) используются в бинарном формате —
// они не должны меняться после релиза
// чтобы не нарушить совместимость

// Запрос на анализ тренировки — данные, необходимые для вычисления метрик.
message AnalyzeWorkoutRequest {
  string  workout_id = 1;
  string  user_id = 2;
  int64 duration = 3;
  double total_distance_km = 4;
  int32 avg_heart_rate = 5;
  int32 max_heart_rate = 6;
  int32 total_calories = 7;
  double avg_pace = 8;
}
// Ответ с результатами анализа — вычисленные метрики тренировки.
message WorkoutAnalysisResponse {
  string  workout_id = 1;
  string  user_id = 2;
  string intensity_level = 3; // уровень нагрузки
  double efficiency_score = 4; // оценка эффективности от 0 до 100
  string heart_rate_zone = 5; // пульсовая зона
  string recommendation = 6; // рекомендация
}


