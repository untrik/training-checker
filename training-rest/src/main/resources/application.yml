server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

spring:
  application:
    name: training-rest
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER:http://localhost:8085/realms/training}
          audiences: training-rest

      client:
        provider:
          keycloak:
            token-uri: http://localhost:8085/realms/training/protocol/openid-connect/token
        registration:
          analytics:
            provider: keycloak
            client-id: training-service-client
            client-secret: training-service-secret
            authorization-grant-type: client_credentials
  datasource:
    url: ${TRAINING_DB_URL:jdbc:postgresql://localhost:5432/training}
    username: ${DB_USER:untrick}
    password: ${DB_PASSWORD:kirpa2005}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 1000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

app:
  analytics:
    base-url: ${ANALYTICS_URL:http://localhost:8666}
    connect-timeout: 200ms
    read-timeout: 800ms
    budget: 2600ms
    reserve: 100ms
    max-attempts: 2
    initial-wait: 150ms
    max-wait: 1s
    jitter: 0.5

management:
  server:
    port: ${MANAGEMENT_PORT:9080}
    address: ${MANAGEMENT_ADDRESS:127.0.0.1}
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 100ms,300ms,500ms,1s,2s
      minimum-expected-value:
        http.server.requests: 1ms
      maximum-expected-value:
        http.server.requests: 3s
  otlp:
    metrics:
      export:
        enabled: false
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      group:
        readiness:
          include: readinessState,db
  observations:
    enable:
      spring.security: false
  tracing:
    propagation:
      type: w3c
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    resource-attributes:
      deployment.environment.name: local
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      file: ecs
  file:
    name: ${LOG_DIR:../runtime-logs}/training-service.log
  include-application-name: false
  pattern:
    correlation: "[${spring.application.name:},trace_id=%X{traceId:-},span_id=%X{spanId:-},request_id=%X{requestId:-}] "
